<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FourierFlight — something is coming.">
  <title>FourierFlight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0f;
      color: #e2e2e5;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .wordmark {
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      color: #f0f0f2;
      line-height: 1.1;
    }

    .divider {
      width: 2rem;
      height: 1px;
      background: #2e2e35;
      margin: 1.75rem auto;
    }

    .tagline {
      font-size: 0.95rem;
      font-weight: 300;
      color: #6b6b78;
      letter-spacing: 0.04em;
    }

    .copyright {
      margin-top: 4rem;
      font-size: 0.75rem;
      color: #3a3a42;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="wordmark">FourierFlight</h1>
    <div class="divider"></div>
    <p class="tagline">Something is coming.</p>
    <p class="copyright">&copy; Copyright 2026 FourierFlight.com</p>
  </div>
</body>
</html>
