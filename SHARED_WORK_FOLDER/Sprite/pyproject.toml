[project]
name = "sprite"
version = "0.11.0"
description = "Sprite — voice-memo Mac pipeline: iCloud .m4a → ffmpeg → whisper-cli → Ollama intent parse → Herman POST /capture/parsed"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "watchdog>=4.0",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
sprite-watcher = "sprite.watcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sprite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
