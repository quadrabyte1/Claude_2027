[project]
name = "mac-reminders-bridge"
version = "0.1.2"
description = "Mac Reminders bridge for Homunculus/Herman — watches vault/reminders/ and pushes handle/remind captures to Reminders.app via AppleScript."
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.1",
    "watchdog>=4.0",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mac-reminders-bridge = "mac_reminders_bridge.watcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mac_reminders_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
