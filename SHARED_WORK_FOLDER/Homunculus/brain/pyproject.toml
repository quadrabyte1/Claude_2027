[project]
name = "homunculus-brain"
version = "2.3.0"
description = "Mac-side brain for the Homunculus voice assistant — markdown-backed capture, scheduling, and reminders."
requires-python = ">=3.11"
dependencies = [
  "fastapi >=0.110",
  "uvicorn[standard] >=0.27",
  "pydantic >=2.6",
  "httpx >=0.27",
  "pyyaml >=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest >=8.0",
  "pytest-asyncio >=0.23",
]

[project.scripts]
homunculus-brain = "homunculus_brain.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["homunculus_brain*"]

[tool.setuptools.package-data]
# Ship the in-browser test client (v1.2.1) inside the wheel so pip-installed
# brains serve /test/ without any extra steps. Vanilla HTML/CSS/JS, no build.
homunculus_brain = ["test_client/*.html", "test_client/*.css", "test_client/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
